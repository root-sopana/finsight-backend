stages:
  - test
  - deploy

test:
  stage: test
  tags:
    - gitlab-runner
  script:
    - echo "Java version:"
    - java -version
    - echo "Maven version:"
    - mvn -version
    - echo "Running tests..."
    - mvn test

deploy:
  stage: deploy
  tags:
    - gitlab-runner
  script:
    - echo "Building Spring Boot application..."
    - mvn clean package -DskipTests
    - echo "Checking generated JAR..."
    - ls -lh target/
    - echo "Deploying backend..."
    - chmod +x scripts/deploy.sh
    - ./scripts/deploy.sh
  only:
    - main

    