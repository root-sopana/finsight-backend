stages:
  - test
  - deploy

variables:
  JAVA_HOME: "/usr/lib/jvm/java-21-amazon-corretto.x86_64"

test:
  stage: test
  tags:
    - pipeline-runner
  script:
    - echo "Java version:"
    - java -version
    - echo "Maven version:"
    - mvn -version
    - echo "Running tests..."
    - mvn test

deploy:
  stage: deploy
  tags:
    - pipeline-runner
  script:
    - echo "Building Spring Boot application..."
    - mvn clean package -DskipTests
    - echo "Checking generated JAR..."
    - ls -lh target/
    - echo "Deploying backend..."
    - chmod +x scripts/deploy.sh
    - ./scripts/deploy.sh
  only:
    - main