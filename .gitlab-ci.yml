stages:
  - test
  - build
  - deploy

variables:
  JAVA_HOME: "/usr/lib/jvm/java-21-amazon-corretto.x86_64"
  
test:
  stage: test
  tags:
    - pipeline-runner
  script:
    - echo "Java version:"
    - java -version
    - echo "Maven version:"
    - mvn -version
    - echo "Running tests..."
    - mvn test

build:
  stage: build
  tags:
    - pipeline-runner
  script:
    - echo "Building application..."
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 hour

deploy:
  stage: deploy
  tags:
    - pipeline-runner
  script:
    - echo "Deploying application..."
    - chmod +x scripts/deploy.sh
    - ./scripts/deploy.sh
  only:
    - main