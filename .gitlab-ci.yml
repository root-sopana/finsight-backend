stages:
  - test
  - build
  - deploy

variables:
  JAVA_HOME: "/usr/lib/jvm/java-21-amazon-corretto.x86_64"

# -------------------------
# TEST
# -------------------------
test:
  stage: test
  tags:
    - pipeline-runner
  script:
    - echo "Java version:"
    - java -version
    - echo "Maven version:"
    - mvn -version
    - echo "Running tests..."
    - mvn test

# -------------------------
# BUILD + DOCKER IMAGE
# -------------------------
build:
  stage: build
  tags:
    - pipeline-runner
  script:
    - echo "Building Spring Boot application..."
    - mvn clean package -DskipTests
    - echo "Checking generated JAR..."
    - ls -lh target/
    - echo "Building Docker image..."
    - docker build -t finsight-backend:latest .
    - echo "Docker image created:"
    - docker images finsight-backend

# -------------------------
# DEPLOY
# -------------------------
deploy:
  stage: deploy
  tags:
    - pipeline-runner
  script:
    - echo "Deploying backend..."
    - chmod +x scripts/deploy.sh
    - ./scripts/deploy.sh
  only:
    - main